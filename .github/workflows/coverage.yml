name: Coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build with coverage counters
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DLUNAUT_COVERAGE=ON
          cmake --build build -j 4

      - name: Test
        run: python tests/run.py --binary build/lunaut

      - name: Collect
        run: |
          pip install --quiet gcovr
          gcovr --root . --filter 'src/Lunaut/' --xml-pretty --output coverage.xml --print-summary

      - uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          disable_search: true
          plugins: noop
          flags: server
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
