name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch or tag to build
        type: string
        default: main
      version:
        description: Version to publish (empty uses CMakeLists.txt)
        type: string
        default: ""
      latest:
        description: Mark as the latest release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      sha: ${{ steps.version.outputs.sha }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Find an unreleased version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.version }}
        run: |
          version="${REQUESTED:-$(sed -nE 's/^project\(lunaut VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.latest }}" = "false" ]; then
            echo "latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "latest=true" >> "$GITHUB_OUTPUT"
          fi

          if gh api "repos/${{ github.repository }}/releases/tags/v$version" > /dev/null 2>&1; then
            echo "v$version is already released"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v$version will be released"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.asset }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: lunaut-win-x64.exe
            binary: build/lunaut.exe
            generator: -G Ninja
          - os: ubuntu-latest
            asset: lunaut-linux-x64
            binary: build/lunaut
            generator: -G Ninja
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: true

      - name: Set version
        shell: bash
        run: sed -i.bak -E "s/^project\(lunaut VERSION [0-9.]+/project(lunaut VERSION ${{ needs.check.outputs.version }}/" CMakeLists.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build
        run: |
          cmake -S . -B build ${{ matrix.generator }} -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Test
        run: python tests/run.py --binary ${{ matrix.binary }}

      - name: Rename
        shell: bash
        run: cp ${{ matrix.binary }} ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-macos:
    name: build (${{ matrix.asset }})
    needs: check
    if: needs.check.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            asset: lunaut-osx-x64
          - os: macos-latest
            asset: lunaut-osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}
          submodules: true

      - name: Set version
        shell: bash
        run: sed -i.bak -E "s/^project\(lunaut VERSION [0-9.]+/project(lunaut VERSION ${{ needs.check.outputs.version }}/" CMakeLists.txt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Test
        run: python tests/run.py --binary build/lunaut

      - name: Rename
        run: cp build/lunaut ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  extension:
    needs: [check, build, build-macos]
    if: ${{ always() && needs.check.outputs.release == 'true' && needs.build.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          pattern: lunaut-*
          path: server
          merge-multiple: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Package
        working-directory: editors/vscode
        shell: bash
        env:
          LUNAUT_BINARIES: ${{ github.workspace }}/server
          LUNAUT_SCHEMA_BINARY: ${{ github.workspace }}/server/lunaut-win-x64.exe
        run: |
          npm ci
          npm version ${{ needs.check.outputs.version }} --no-git-tag-version --allow-same-version
          npm run package

      - uses: actions/upload-artifact@v4
        with:
          name: lunaut.vsix
          path: editors/vscode/lunaut.vsix

  studio-plugin:
    needs: [check]
    if: ${{ needs.check.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Build the Studio plugin
        run: |
          curl -sSL -o rojo.zip https://github.com/rojo-rbx/rojo/releases/download/v7.6.1/rojo-7.6.1-linux-x86_64.zip
          unzip -q rojo.zip -d rojo
          chmod +x rojo/rojo
          rojo/rojo build plugins/studio -o LunautPlugin.rbxm

      - uses: actions/upload-artifact@v4
        with:
          name: LunautPlugin.rbxm
          path: LunautPlugin.rbxm

  publish:
    needs: [check, build, build-macos, extension, studio-plugin]
    if: ${{ always() && needs.check.outputs.release == 'true' && needs.build.result == 'success' && needs.extension.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Release notes
        run: python3 scripts/release.py notes ${{ needs.check.outputs.version }} > notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ needs.check.outputs.sha }}
          name: lunaut ${{ needs.check.outputs.version }}
          body_path: notes.md
          prerelease: ${{ contains(needs.check.outputs.version, '-') }}
          make_latest: ${{ needs.check.outputs.latest == 'true' && !contains(needs.check.outputs.version, '-') }}
          files: assets/*

      - uses: actions/setup-node@v4
        if: ${{ !contains(needs.check.outputs.version, '-') && (env.VSCE_PAT != '' || env.OVSX_PAT != '') }}
        with:
          node-version: 20

      - name: Publish to the VS Code Marketplace
        if: ${{ !contains(needs.check.outputs.version, '-') && env.VSCE_PAT != '' }}
        run: npx --yes @vscode/vsce@3 publish --packagePath assets/lunaut.vsix

      - name: Publish to Open VSX
        if: ${{ !contains(needs.check.outputs.version, '-') && env.OVSX_PAT != '' }}
        run: npx --yes ovsx@0.10 publish --packagePath assets/lunaut.vsix --pat "$OVSX_PAT"
