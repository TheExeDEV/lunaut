name: Definitions

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: definitions
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download
        run: |
          mkdir definitions
          cd definitions
          source=https://luau-lsp.pages.dev

          for level in None LocalUserSecurity PluginSecurity RobloxScriptSecurity; do
            curl -fsSL --retry 3 -o "globalTypes.$level.d.luau" "$source/type-definitions/globalTypes.$level.d.luau"
          done

          curl -fsSL --retry 3 -o api-docs.roblox.json "$source/api-docs/en-us.json"
          curl -fsSL --retry 3 -o api-docs.luau.json "$source/api-docs/luau-en-us.json"
          curl -fsSL --retry 3 -o LICENSE-luau-lsp.txt https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/LICENSE.md
          ls -la

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view definitions --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create definitions --repo "$GITHUB_REPOSITORY" --title "Roblox definitions" --prerelease --latest=false \
              --notes "Roblox type definitions and API docs that lunaut downloads, refreshed every day. Generated by luau-lsp from the Roblox API dump, see LICENSE-luau-lsp.txt."
          fi

          gh release upload definitions definitions/* --repo "$GITHUB_REPOSITORY" --clobber
