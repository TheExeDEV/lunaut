name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: build/lunaut.exe
          - os: ubuntu-latest
            binary: build/lunaut
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check the Luau submodule matches luau.version
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < luau.version)"
          commit="$(git -C extern/luau rev-parse HEAD)"
          git ls-remote --tags https://github.com/luau-lang/luau.git "refs/tags/$version" "refs/tags/$version^{}" | grep -q "^$commit" || { echo "extern/luau is at $commit, not at Luau $version"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Test
        run: python tests/run.py --binary ${{ matrix.binary }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.os }}
          path: tests/report.md
