name: macOS

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner
        type: choice
        default: macos-latest
        options:
          - macos-latest
          - macos-15-intel

jobs:
  build:
    name: build (${{ inputs.runner }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4

      - name: Test
        run: python tests/run.py --binary build/lunaut

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ inputs.runner }}
          path: tests/report.md
