name: Update Luau

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check the push token
        env:
          LUAU_UPDATE_TOKEN: ${{ secrets.LUAU_UPDATE_TOKEN }}
        run: |
          if [ -z "$LUAU_UPDATE_TOKEN" ]; then
            echo "::error::Add the LUAU_UPDATE_TOKEN secret: a fine-grained token of the repository owner with Contents read and write. main only takes pushes from admins, and the built-in token is not one."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.LUAU_UPDATE_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump luau.version
        id: bump
        run: echo "version=$(python scripts/update_luau.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test with the new Luau
        if: steps.bump.outputs.version != ''
        run: |
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          python tests/run.py

      - name: Commit and release
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "TheExeDEV"
          git config user.email "209019560+TheExeDEV@users.noreply.github.com"
          git add luau.version extern/luau CHANGELOG.md
          git commit -m "Sync to upstream Luau ${{ steps.bump.outputs.version }}"

          release="$(python scripts/release.py bump)"
          git add CHANGELOG.md CMakeLists.txt editors/vscode/package.json editors/zed/Cargo.toml editors/zed/Cargo.lock editors/zed/extension.toml
          git commit -m "Release $release"
          git push origin HEAD:main

          echo "Released lunaut $release with Luau ${{ steps.bump.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
