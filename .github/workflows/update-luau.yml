name: Update Luau

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump luau.version
        id: bump
        run: echo "version=$(python scripts/update_luau.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test with the new Luau
        if: steps.bump.outputs.version != ''
        run: |
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          python tests/run.py

      - name: Open a pull request
        if: steps.bump.outputs.version != ''
        uses: peter-evans/create-pull-request@v6
        with:
          title: Sync to upstream Luau ${{ steps.bump.outputs.version }}
          body: |
            Sync to upstream Luau ${{ steps.bump.outputs.version }}
            - Generated by the daily `update-luau` workflow
            - Build and tests already passed on this version
          branch: auto/update-luau
          commit-message: Sync to upstream Luau ${{ steps.bump.outputs.version }}
