name: Update Luau

on:
  workflow_dispatch:
  schedule:
    - cron: "10 0 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump luau.version
        id: bump
        run: echo "version=$(python scripts/update_luau.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test with the new Luau
        if: steps.bump.outputs.version != ''
        run: |
          cmake -S . -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j 4
          python tests/run.py

      - name: Commit to main
        if: steps.bump.outputs.version != ''
        run: |
          git config user.name "TheExeDEV"
          git config user.email "ddurakov545@gmail.com"
          git add luau.version extern/luau CHANGELOG.md
          git commit -m "Sync to upstream Luau ${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
