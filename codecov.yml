codecov:
  require_ci_to_pass: true

parsers:
  cobertura:
    partials_as_hits: true

coverage:
  precision: 1
  round: down
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "extern/**"
  - "tests/**"

comment:
  layout: "condensed_header, condensed_files"
  require_changes: true
